name: Statistiques des posts

on:
  schedule:
    # Chaque matin vers 8h30 (Paris) : Buffer rafraîchit les statistiques une fois par jour.
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever les statistiques et écrire le tableau de bord
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/metrics.py
      - name: Enregistrer stats/ dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "Statistiques du $(date -u +%d/%m/%Y)"
          git pull --rebase --quiet && git push
